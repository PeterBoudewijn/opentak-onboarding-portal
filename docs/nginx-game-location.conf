# Nginx location block for serving the OpenTAK Onboarding Portal under /game/
# Add this inside the existing server block for atak.3division.eu.
#
# The trailing slash on proxy_pass is important: it strips the /game/ prefix
# before forwarding to the portal, whose Flask routes remain rooted at /api/v1.
location = /game {
    return 301 /game/;
}

location /game/ {
    proxy_pass http://127.0.0.1:5000/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Safe defaults for the portal API and frontend.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
